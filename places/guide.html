<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>完整旅行攻略</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="place-detail.css">
</head>
<body>
  <nav class="topbar">
    <a class="back" id="topBack" href="../index.html#overview">← 回到主攻略</a>
    <a class="jump" href="#choices">直接看怎么选 ↓</a>
  </nav>

  <header class="hero">
    <img id="heroImage" alt="">
    <div class="hero-copy">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="placeTitle"></h1>
      <p class="hero-lede" id="placeCn"></p>
    </div>
  </header>

  <main class="wrap">
    <section class="verdict">
      <strong>顾问观察</strong>
      <p id="verdict"></p>
    </section>

    <div class="date-strip">
      <b>2026年9月</b>
      <p id="update"></p>
    </div>

    <section class="section guide-gallery-section" aria-labelledby="galleryTitle">
      <div class="section-head">
        <h2 id="galleryTitle">先看这里是什么样子</h2>
        <p class="section-intro">不先读一长串景点。先用城市全景、代表性地点和真实街景判断，全家是否真的对这里有感觉。</p>
      </div>
      <div class="route-photo-band" id="placeGallery"></div>
    </section>

    <section class="section" id="choices">
      <div class="section-head">
        <h2>按当天状态，三种走法</h2>
        <p class="section-intro">不用四个人先决定所有细节。到前一晚看天气、体力和想吃什么，再选全家版或分组版。</p>
      </div>
      <div class="pick-grid" id="choiceGrid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>完整版本时间表</h2>
        <p class="section-intro">这是方向，不是必须准点完成的清单。午餐、咖啡和临时停留都可以把后半段往后推。</p>
      </div>
      <div class="timeline guide-timeline" id="schedule"></div>
    </section>

    <section class="decision">
      <div class="note">
        <h3>直接行动</h3>
        <div class="actions" id="officialLinks"></div>
      </div>
      <div class="note gold">
        <h3>看照片再决定</h3>
        <p>如果看完照片后没有至少两个人明显期待，就先不占用日历天数；其他候选仍然平行保留，随时可以换回来。</p>
        <p><a class="btn secondary" id="xhsLink" target="_blank" rel="noopener">小红书搜索这个地方</a></p>
      </div>
    </section>

    <nav class="footer-nav">
      <a id="bottomBack" href="../index.html#overview">← 回到主攻略</a>
      <a href="../index.html#overview">回到拖拽日历 →</a>
    </nav>
  </main>

  <script src="../planner-guides.js"></script>
  <script src="../place-gallery-data.js"></script>
  <script src="guide-data.js"></script>
  <script src="guide-page.js"></script>
</body>
</html>
